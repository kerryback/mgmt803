<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Sign-Up Sheet &middot; Claude for Teaching &amp; Research</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128203;</text></svg>">
<style>
:root { --navy:#00205B; --gold:#b8912f; --ink:#1a1a1a; --gray:#555; --line:#e4e4e4; --bg:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --navy:#8fb3ff; --gold:#d8b25a; --ink:#e8eaed; --gray:#aab; --line:#2b3038; --bg:#12161c; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.sheet { max-width: 620px; }
h1 { color: var(--navy); font-size: 1.6rem; font-weight: 600; margin-bottom: 18px; }
p { color: var(--gray); font-size: 1.05rem; line-height: 1.6; margin-bottom: 26px; }
a.link {
  display: inline-block; color: var(--navy); font-size: 1.1rem; font-weight: 600;
  text-decoration: none; border-bottom: 2px solid var(--gold);
  padding-bottom: 3px; word-break: break-word;
}
a.link:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="sheet">
  <h1>GitHub sign-up sheet</h1>
  <p>Enter your GitHub username in the shared spreadsheet.</p>
  <a class="link" href="https://docs.google.com/spreadsheets/d/1RcNxDJ1Vg1HuQNi5H82h1XYypHA7L6yruXkJo8KFQgc/edit?usp=sharing" target="_blank" rel="noopener">Open the Google Sheet</a>
</div>
</body>
</html>
