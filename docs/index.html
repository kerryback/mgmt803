<style>
/* This page is a static resource rather than a rendered .qmd, so it carries its
   own styling and its own nav -- Quarto's navbar is not injected here. */
:root { --navy:#00205B; --gold:#b8912f; --ink:#1a1a1a; --gray:#444; --line:#e4e4e4;
        --bg:#fff; --bar:#2c3e50; --barink:#e6e9ed; }
@media (prefers-color-scheme: dark) {
  :root { --navy:#8fb3ff; --gold:#d8b25a; --ink:#e8eaed; --gray:#aab4c0; --line:#2b3038;
          --bg:#12161c; --bar:#1c2530; --barink:#e6e9ed; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink);
       font-family: "Helvetica Neue", Arial, sans-serif; }

.topbar { display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 52px;
          background: var(--bar); color: var(--barink); }
.topbar .brand { font-size: 17px; font-weight: 500; }
.topbar nav { margin-left: auto; display: flex; gap: 20px; }
.topbar nav a { color: var(--barink); text-decoration: none; font-size: 15px; opacity: .85; }
.topbar nav a:hover { opacity: 1; text-decoration: underline; }

.flyer { margin: 8px 0 24px; }
.flyer .sheet { width: 100%; max-width: 900px; margin: 0 auto; padding: 24px 16px 8px; }
.flyer .eyebrow { text-align: center; font-size: 17px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--navy); font-weight: 700; margin-bottom: 12px; }
.flyer .display { text-align: center; font-family: Georgia, "Times New Roman", serif;
  font-size: 48px; line-height: 1.1; color: var(--navy); font-weight: 700; margin-bottom: 22px; }
.flyer .meta-inline { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 18px; }
.flyer .meta-inline span { font-size: 18px; color: var(--gray); }
.flyer .meta-inline .dot { color: var(--gold); font-weight: 700; }
.flyer .subline { text-align: center; font-size: 18px; color: var(--gray); margin-top: 6px; }
.flyer .subline b { color: var(--ink); }
.flyer .rule { height: 3px; border-radius: 2px; margin: 26px 0 22px;
  background: linear-gradient(90deg, var(--navy) 0 62%, var(--gold) 62% 100%); }
.flyer .section-head { display: flex; align-items: baseline; justify-content: space-between;
  margin: 20px 0 10px; }
.flyer .section-head .label, .flyer .section-head .dates { font-size: 14px; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--gold); font-weight: 700; }
.flyer .item { display: flex; gap: 16px; align-items: flex-start; padding: 8px 0; }
/* Each chip links to that session's deck; for now they all lead to the
   Under Construction page. */
.flyer .chip { flex: 0 0 150px; background: var(--navy); color: #fff; font-size: 14px;
  font-weight: 700; letter-spacing: 1px; text-align: center; padding: 7px 0; border-radius: 6px;
  text-decoration: none; display: block; transition: background 0.15s; }
.flyer a.chip:hover, .flyer a.chip:focus { background: #003087; color: #fff; text-decoration: none; }
.flyer a.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.flyer .chip .chip-time { display: block; font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.5px; opacity: 0.85; margin-top: 2px; }
.flyer .item-title { font-size: 19px; font-weight: 700; color: var(--navy); }
.flyer .item-desc { font-size: 15.5px; color: var(--gray); line-height: 1.4; margin-top: 2px; }
.flyer .tbd { color: var(--gray); font-weight: 400; font-style: italic; }
.flyer .sheet-foot { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.flyer .sheet-foot a { text-decoration: none; color: var(--navy); font-weight: 700; font-size: 17px; }
.flyer .sheet-foot a:hover { text-decoration: underline; }
@media (max-width: 600px) {
  .flyer .display { font-size: 33px; }
  .flyer .chip { flex-basis: 116px; font-size: 12px; }
  .flyer .chip .chip-time { font-size: 10.5px; letter-spacing: 0; }
  .flyer .item-title { font-size: 17px; }
}
</style>
</head>

      <div class="item"><a class="chip" href="under-construction.html" title="Slides not posted yet">SEP 25<span class="chip-time">Morning</span></a><div><div class="item-title tbd">TBD</div><div class="item-desc"></div></div></div>
      <div class="item"><a class="chip" href="under-construction.html" title="Slides not posted yet">SEP 26<span class="chip-time">Morning</span></a><div><div class="item-title tbd">TBD</div><div class="item-desc"></div></div></div>
      <div class="item"><a class="chip" href="under-construction.html" title="Slides not posted yet">SEP 26<span class="chip-time">Afternoon</span></a><div><div class="item-title tbd">TBD</div><div class="item-desc"></div></div></div>
      <div class="item"><a class="chip" href="under-construction.html" title="Slides not posted yet">SEP 27<span class="chip-time">Morning</span></a><div><div class="item-title tbd">TBD</div><div class="item-desc"></div></div></div>

      </div>
    </div>
  </div>
</body>
</html>
