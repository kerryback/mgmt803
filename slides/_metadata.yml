# Applies to every deck in slides/, so they render as reveal.js as part of the
# website build (the root _quarto.yml renders slides/*.qmd into docs/slides/).
#
# Every deck here uses the shoji2 theme. width/height/margin/max-scale are the
# canvas shoji2 is designed against: 1280x720 with no reveal margin. All four
# are load bearing -- the theme's frame is specified in canvas pixels, reveal's
# default 10% margin puts every seam on a fractional device pixel, and reveal's
# default 2x scale cap stops the deck growing on a large display.
date-format: "ddd MMM D, YYYY"

format:
  revealjs:
    theme: shoji2.scss
    width: 1280
    height: 720
    margin: 0
    max-scale: 5
    slide-number: c/t
    transition: fade
    navigation-mode: linear
    highlight-style: github
    # Reveal's auto-stretch wraps a lone image in a sizing container and shrinks
    # it to the height left over after the heading and any note, which overrides
    # the width set on the image. The theme's own `max-height: 470px` on img is
    # the guard we want instead.
    auto-stretch: false
    html-math-method: mathjax
